[data]
# dataset_use = ['SZ_DIDI']
dataset_use = ['SZ_DIDI']
his = 288
pred = 288
# --- Supervised Evaluation Settings (from paper) ---
# Datasets included in pre-training phase, OpenCity model directly evaluated.
# PEMS_BAY:                  val_ratio = 0.1, test_ratio = 0.4  (train/val/test = 0.5/0.1/0.4)
# CAD8-1, CAD8-2, CAD12-2:  val_ratio = 0.1, test_ratio = 0.1  (train/val/test = 0.8/0.1/0.1)
# NYC_TAXI:                  2016-2020 train, Jan-Feb 2021 val, Mar-Dec 2021 test (approx val=0.028, test=0.139)
#
# --- Zero-shot Evaluation Settings (from paper) ---
# Datasets NOT in pre-training phase. OpenCity tested directly; baselines trained supervised.
# CAD3, CAD5, PEMS07M, TrafficSH:  val_ratio = 0.1, test_ratio = 0.4  (train/val/test = 0.5/0.1/0.4)
# CHI_TAXI, NYC_BIKE-3:            val_ratio = 0.2, test_ratio = 0.6  (train/val/test = 0.2/0.2/0.6)
#
# --- Pre-training Data Loading (controlled by mode=='pretrain' in data_process.py) ---
# When -mode pretrain, only earlier data is loaded to avoid test data leakage:
#   PEMS_BAY:  loads Jan-Feb 2017 only (59 days);  test mode loads Jan-Apr (120 days)
#   NYC_TAXI:  loads 2016-2020 only;               test mode loads 2016-2021 (full)
#   CAD*:      loads first 60 days;                 test mode loads first 75 days
# Other datasets (PEMS04, PEMS08, METR_LA, Traffic*, DIDI, etc.) load the same data in all modes.
# Pre-training uses val_ratio = 0.0, test_ratio = 0.0 (all loaded data used for training).
val_ratio = 0.1
test_ratio = 0.4
normalizer = std
column_wise = False
input_base_dim = 1
input_extra_dim = 2
output_dim = 1

[train]
loss_func = mask_mae
seed = 12
batch_size = 32
epochs = 10
lr_init = 0.001
lr_decay = False
lr_decay_rate = 0.3
lr_decay_step = 25, 50, 100
early_stop = False
early_stop_patience = 20
grad_norm = True
max_grad_norm = 5
debug = True
save_model = True
real_value = True
seed_mode = False
xavier = False
load_pretrain_path = OpenCity-plus.pth
save_pretrain_path = OpenCity.pth

[test]
mae_thresh = 0.
mape_thresh = 0.001

[log]
log_step = 100
save_step = 1000
